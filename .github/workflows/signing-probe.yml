name: Signing CLI probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-2025
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Set up matching JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Inspect public signing arguments with a nonexistent key
        run: |
          $ErrorActionPreference = 'Stop'
          $jar = Join-Path $env:ANDROID_HOME 'build-tools/37.0.0/lib/apksigner.jar'
          $KeystorePath = Join-Path $env:RUNNER_TEMP 'probe-no-key.jks'
          $KeyAlias = '秋风のとおり道'
          $inputApk = Join-Path $env:RUNNER_TEMP 'probe-no-input.apk'
          $outputApk = Join-Path $env:RUNNER_TEMP 'probe-no-output.apk'
          @'
          import com.android.apksigner.ApkSignerTool;
          public class SigningArgsProbe {
              public static void main(String[] args) throws Exception {
                  System.out.println("argc=" + args.length);
                  for (int i = 0; i < args.length; i++) {
                      System.out.println("arg[" + i + "]=" + args[i]);
                      System.out.println("codepoints=" + args[i].codePoints().mapToObj(Integer::toHexString).toList());
                  }
                  for (String key : new String[]{"java.version", "java.vendor", "native.encoding", "sun.jnu.encoding", "file.encoding"}) {
                      System.out.println(key + "=" + System.getProperty(key));
                  }
                  ApkSignerTool.main(args);
              }
          }
          '@ | Set-Content -Encoding utf8 (Join-Path $env:RUNNER_TEMP 'SigningArgsProbe.java')
          & "$env:JAVA_HOME/bin/javac.exe" -cp $jar (Join-Path $env:RUNNER_TEMP 'SigningArgsProbe.java')
          if ($LASTEXITCODE -ne 0) { throw 'Argument probe compilation failed' }
          & "$env:JAVA_HOME/bin/java.exe" -cp "$jar;$env:RUNNER_TEMP" SigningArgsProbe sign --ks $KeystorePath --ks-key-alias $KeyAlias --ks-pass env:REVIA_KS_PASS --key-pass env:REVIA_KS_PASS --v2-signing-enabled true --v3-signing-enabled true --v4-signing-enabled false --out $outputApk $inputApk
          "Probe exit code: $LASTEXITCODE (key and APK intentionally absent)"
          $global:LASTEXITCODE = 0
